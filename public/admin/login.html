<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení — Bicom Písek Virtual Office</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
    <style>
        body {
            background-color: var(--c-alabaster);
            color: var(--c-charcoal);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: var(--sp-4);
            box-sizing: border-box;
            background-image: radial-gradient(circle at 10% 20%, rgba(115, 138, 117, 0.03) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(197, 168, 120, 0.03) 0%, transparent 40%);
        }

        .login-card {
            background-color: var(--c-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            padding: var(--sp-8);
            box-sizing: border-box;
            border: 1px solid rgba(115, 138, 117, 0.1);
            transform: translateY(10px);
            opacity: 0;
            animation: slideUp 0.6s var(--ease-out) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-logo {
            font-size: 3.5rem;
            text-align: center;
            margin-bottom: var(--sp-2);
            filter: drop-shadow(0 4px 10px rgba(58, 74, 60, 0.05));
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--sp-6);
        }

        .login-title {
            font-family: var(--font-head);
            font-size: 2.25rem;
            color: var(--c-forest);
            margin: 0 0 var(--sp-1) 0;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            font-size: var(--text-sm);
            color: var(--c-sage);
            margin: 0;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: var(--sp-4);
            position: relative;
        }

        .form-label {
            display: block;
            font-size: var(--text-xs);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--c-sage);
            margin-bottom: var(--sp-2);
        }

        .form-input {
            width: 100%;
            height: 42px;
            padding: 0 var(--sp-4);
            border-radius: var(--radius-md);
            border: 1px solid rgba(115, 138, 117, 0.2);
            font-family: var(--font-body);
            font-size: var(--text-base);
            box-sizing: border-box;
            background-color: var(--c-alabaster);
            color: var(--c-charcoal);
            transition: all var(--duration-fast) var(--ease-out);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--c-sage);
            background-color: var(--c-white);
            box-shadow: 0 0 0 3px rgba(115, 138, 117, 0.15);
        }

        .login-btn {
            width: 100%;
            height: 42px;
            border-radius: var(--radius-md);
            background-color: var(--c-forest);
            color: var(--c-white);
            border: none;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: var(--text-base);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--sp-2);
        }

        .login-btn:hover {
            background-color: var(--c-forest-deep);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-error {
            display: none;
            background-color: var(--c-error-bg);
            color: var(--c-error);
            border: 1px solid rgba(196, 93, 79, 0.15);
            padding: var(--sp-3);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            margin-bottom: var(--sp-4);
            animation: shake 0.4s ease-in-out;
            font-weight: 500;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .login-footer {
            text-align: center;
            margin-top: var(--sp-6);
            font-size: var(--text-xs);
            color: var(--c-sage);
        }
        
        .login-footer p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">🔒</div>
        <div class="login-header">
            <h1 class="login-title">Bicom Písek</h1>
            <p class="login-subtitle">Vstup do virtuální kanceláře</p>
        </div>

        <div class="login-error" id="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="password">Přístupové heslo</label>
                <input class="form-input" type="password" id="password" required autocomplete="current-password" autofocus placeholder="••••••••">
            </div>

            <button class="login-btn" type="submit" id="submit-btn">
                <span>Přihlásit se</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="login-footer">
            <p>© 2026 BIO ONE LIFE s.r.o.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            errorMessage.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.querySelector('span').innerText = 'Ověřování...';

            const password = passwordInput.value;

            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (res.ok && data.ok) {
                    // Redirect back to the requested page or default to admin dashboard
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect_url') || '/admin/';
                    window.location.href = redirectUrl;
                } else {
                    showError(data.error || 'Nesprávné heslo.');
                }
            } catch (err) {
                showError('Nelze se spojit se serverem. Zkontrolujte připojení.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span').innerText = 'Přihlásit se';
            }
        });

        function showError(text) {
            errorMessage.innerText = text;
            errorMessage.style.display = 'block';
            passwordInput.value = '';
            passwordInput.focus();
        }
    </script>
</body>
</html>
